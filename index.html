<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Para María José 🤍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --dark-top:#3d0f2b;
    --dark-bottom:#1a0b16;
    --pink:#ff6b9d;
    --pink-light:#ffc2d6;
    --text:#fff4f8;
    --wine:#3d0f2b;
    --cream:#fffaf5;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; width:100%; min-height:100%;
    overflow-x:hidden;
  }

  body{
    background:radial-gradient(ellipse at top, var(--dark-top) 0%, var(--dark-bottom) 70%) fixed;
    background-attachment:fixed;
    color:var(--text);
    font-family:'Poppins', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    position:relative;
  }

  .app{
    width:100%;
    max-width:440px;
    padding:0 16px;
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- floating rain (hearts & peonies) ---------- */
  #rain-layer{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:5;
  }

  .float-item{
    position:absolute;
    bottom:-60px;
    opacity:0;
    will-change:transform, opacity;
    animation-name:floatUp;
    animation-timing-function:ease-in;
    animation-fill-mode:forwards;
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    85%{ opacity:.9; }
    100%{ transform:translateY(-115vh) rotate(360deg); opacity:0; }
  }

  .float-item.heart{
    color:#fff;
    filter:drop-shadow(0 0 4px rgba(255,255,255,.5));
    line-height:1;
  }

  /* ---------- screen 1: envelope ---------- */
  #envelope-screen{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    text-align:center;
    position:relative;
    z-index:2;
  }

  #envelope-screen.opening{
    animation:envelopeScreenOut .7s ease forwards;
  }

  @keyframes envelopeScreenOut{
    to{ opacity:0; transform:scale(.9); }
  }

  .envelope-wrap{
    cursor:pointer;
    animation:heartbeat 1.7s ease-in-out infinite;
  }

  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.045); }
  }

  .envelope{
    width:260px;
    height:170px;
    background:var(--pink-light);
    border-radius:8px;
    position:relative;
    box-shadow:0 14px 34px rgba(255,107,157,.4), 0 0 0 1px rgba(255,255,255,.15) inset;
    overflow:visible;
  }

  .envelope-flap{
    position:absolute;
    top:0; left:0;
    width:0; height:0;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-top:96px solid #ffb3cf;
    border-radius:8px 8px 0 0;
    z-index:2;
  }

  .envelope-seal{
    position:absolute;
    top:58px;
    left:50%;
    transform:translateX(-50%);
    width:64px;
    height:64px;
    border-radius:50%;
    background:#fff6f9;
    box-shadow:0 4px 10px rgba(61,15,43,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3;
  }

  .envelope-seal svg{ width:44px; height:44px; }

  .envelope-title{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:2.1rem;
    color:var(--pink-light);
    text-shadow:0 2px 10px rgba(255,107,157,.35);
  }

  .envelope-hint{
    font-size:.85rem;
    color:var(--pink-light);
    opacity:.85;
    letter-spacing:.2px;
  }

  /* ---------- screen 2: surprise ---------- */
  #surprise-screen{
    display:none;
    width:100%;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:28px 0 60px;
    position:relative;
    z-index:2;
  }

  .reveal-card{
    width:100%;
    opacity:0;
    transform:translateY(40px);
    animation:slideUpFade .8s ease forwards;
  }

  @keyframes slideUpFade{
    to{ opacity:1; transform:translateY(0); }
  }

  /* polaroid photo card */
  .polaroid{
    width:85%;
    margin:0 auto;
    background:var(--cream);
    border-radius:6px;
    padding:14px 14px 20px;
    box-shadow:0 16px 30px rgba(0,0,0,.35);
    transform:rotate(-2deg);
    position:relative;
  }

  .polaroid-photo{
    width:100%;
    aspect-ratio:4/5;
    border-radius:2px;
    overflow:hidden;
    background:#ffe3ee;
    display:block;
    position:relative;
    touch-action:pan-y;
  }

  .photo-slide{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transition:opacity .5s ease;
    pointer-events:none;
  }

  .photo-slide.active{
    opacity:1;
  }

  .photo-fallback{
    width:100%;
    height:100%;
    display:none;
    align-items:center;
    justify-content:center;
    background:#ffe3ee;
    font-size:3.4rem;
  }

  .photo-dots{
    display:none;
    justify-content:center;
    gap:6px;
    margin-top:9px;
  }

  .photo-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(61,15,43,.25);
    transition:background .3s ease, transform .3s ease;
  }

  .photo-dot.active{
    background:var(--pink);
    transform:scale(1.3);
  }

  .polaroid-caption{
    margin-top:12px;
    text-align:center;
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:1.6rem;
    color:var(--wine);
  }

  /* glass-style cards (player + letter) */
  .glass-card{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,194,214,.35);
    border-radius:18px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    padding:18px 18px 20px;
    box-shadow:0 10px 26px rgba(0,0,0,.3);
  }

  /* music player */
  .player-top{
    display:flex;
    align-items:center;
    gap:12px;
  }

  .eq-box{
    width:52px;
    height:52px;
    flex:0 0 52px;
    border-radius:12px;
    background:linear-gradient(135deg, var(--pink), #c23f6e);
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:4px;
    padding-bottom:10px;
  }

  .eq-box span{
    width:4px;
    background:#fff;
    border-radius:2px;
    height:10px;
    animation:eqBounce .9s ease-in-out infinite;
  }

  .eq-box span:nth-child(1){ animation-delay:0s; }
  .eq-box span:nth-child(2){ animation-delay:.2s; }
  .eq-box span:nth-child(3){ animation-delay:.4s; }

  .eq-box.paused span{
    animation-play-state:paused;
    height:5px;
  }

  @keyframes eqBounce{
    0%,100%{ height:6px; }
    50%{ height:26px; }
  }

  .player-info{
    flex:1;
    min-width:0;
  }

  .song-title{
    font-weight:600;
    font-size:1.02rem;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .song-artist{
    font-size:.78rem;
    color:var(--pink-light);
    opacity:.85;
    margin-top:2px;
  }

  .play-btn{
    flex:0 0 44px;
    width:44px;
    height:44px;
    border-radius:50%;
    border:none;
    background:var(--pink);
    color:#fff;
    font-size:1rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 14px rgba(255,107,157,.5);
  }

  .player-bottom{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:16px;
  }

  .time-label{
    font-size:.72rem;
    color:var(--pink-light);
    min-width:32px;
    text-align:center;
  }

  .progress-track{
    flex:1;
    height:6px;
    background:rgba(255,255,255,.18);
    border-radius:4px;
    position:relative;
    cursor:pointer;
  }

  .progress-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    width:0%;
    background:var(--pink);
    border-radius:4px;
  }

  /* letter */
  .letter-title{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:1.7rem;
    color:var(--pink-light);
    margin-bottom:6px;
    text-align:center;
  }

  .letter-text{
    font-family:'Dancing Script', cursive;
    font-size:clamp(1.15rem, 5.2vw, 1.45rem);
    line-height:1.5;
    white-space:pre-line;
    color:var(--text);
    min-height:40px;
    word-wrap:break-word;
    overflow-wrap:break-word;
  }

  .letter-text strong{
    font-weight:700;
    color:var(--pink-light);
  }

  .cursor{
    display:inline-block;
    animation:blink 1s step-start infinite;
  }

  @keyframes blink{
    50%{ opacity:0; }
  }

  .counter{
    margin-top:18px;
    text-align:center;
    font-size:.85rem;
    color:var(--pink-light);
    opacity:0;
    transition:opacity 1s ease;
  }

  .counter.show{ opacity:1; }

  .signature{
    margin-top:16px;
    text-align:right;
    font-family:'Dancing Script', cursive;
    font-size:1.5rem;
    color:var(--pink-light);
    opacity:0;
    transition:opacity 1s ease .3s;
  }

  .signature.show{ opacity:1; }

</style>
</head>

<script>
/* =====================================================================
   CONFIGURACIÓN — edita aquí el mensaje, la fecha de inicio y la canción
   ===================================================================== */

// Fotos de la galería (en orden). Agrega o quita nombres de archivo aquí;
// todas deben estar en la misma carpeta que este index.html.
// Si alguna no carga, se salta sola (no rompe la galería).
const PHOTOS = [
  "foto.jpg",
  "foto2.jpg",
  "foto3.jpg",
  "foto4.jpg",
  "foto5.jpg"
];

// Fecha en la que empezó la relación (para el contador en vivo)
const START_DATE = new Date(2024, 6, 28, 0, 0, 0); // 28 de julio de 2024 (mes 6 = julio, base 0)

// Datos de la canción que suena en el reproductor
const SONG_NAME = "Sin Ti";
const SONG_ARTIST = "Antonio Cartagena · Salsa";

// Texto completo de la carta (los saltos de línea se respetan tal cual).
// Usa **texto** para que esa parte salga en negrita al escribirse.
const LETTER_MESSAGE =
`**Mi María José 🤍**

Hoy cumplimos 26 meses de estar compartiendo la vida, y quería darte esta sorpresa y regalarte esta carta hecha por mis propias manos.

Quiero dedicarte una canción. Se llama **"Sin Ti", de Antonio Cartagena**. Es una canción muy sentimental y expresa muchas cosas que yo siento y que a veces no sé cómo explicar con palabras.

Te la dedico porque muchas veces en una canción uno logra decir cosas que no sabe cómo explicar, y esta me hace pensar mucho en nosotros, en todo lo que hemos construido y en lo diferente que sería mi vida si tú no estuvieras en ella.

Porque ya eres parte de mi vida, de mis pensamientos, de mis recuerdos y de tantos momentos que hemos vivido juntos. Y cuando pienso en un "sin ti", sinceramente, no me imagino las cosas de la misma manera. No porque mi vida no pudiera continuar, sino porque ya no sería la misma vida que conozco y que quiero.

En estos 26 meses que hemos compartido juntos, hemos tenido momentos de todo tipo: hemos tenido nuestras altas, nuestros bajones, momentos muy bonitos y también momentos difíciles. Y sé que en este momento hemos pasado por situaciones que no han sido fáciles, que a veces no nos entendemos, que a veces nos decepcionamos y que no todo siempre sale como queremos.

espero que la cosas cambie , que vuelva esa maria jose que siempre he querido que seas , se que que por mi gran culpa ha pasado todo eso y me duele, pero quiero que sepas que estoy para mejor y ser el mejor novio , mejor amigo y el mejor compañero de vida que puedas tener , solo quiero que me des esa oportunidad y qu ejunto salgo de este momento y seamos felices.

Pero quiero que sepas algo: **el amor que siento por ti es muy grande. Te amo con mi alma y, a pesar de las dificultades, quiero todo contigo.**

Por eso quiero dedicarte esta canción. Porque mi vida sin ti ya no sería lo mismo. Porque después de todo este tiempo, te has convertido en una parte muy importante de mi vida y de la persona que soy.

Quiero seguir compartiendo contigo, seguir creciendo juntos, seguir aprendiendo el uno del otro y, sobre todo, seguir construyendo nuestra historia.

Espero que todavía nos quede **muchísima historia por vivir** y que estos 26 meses sean solamente una pequeña parte de todo lo que nos falta.

Así que esta canción es para ti, mi María José. 🤍

Espero que disfrutes este pequeño detalle que quise prepararte con mucho cariño: **unas fresas con crema y esta carta**, que aunque sea algo sencillo, lleva todo mi amor y todo lo que quería decirte hoy.

**Te amo. Feliz 26 meses. 🤍**`;

/* =====================================================================
   FIN DE LA CONFIGURACIÓN — no hace falta tocar nada debajo de aquí
   ===================================================================== */

document.getElementById('songTitle').textContent = SONG_NAME;
document.getElementById('songArtist').textContent = SONG_ARTIST;

/* ---------------------- galería de fotos ---------------------- */
let gallerySlideIndex = 0;
let galleryTotal = 0;

function showGallerySlide(index){
  const slides = document.querySelectorAll('.photo-slide');
  const dots = document.querySelectorAll('.photo-dot');
  slides.forEach((s,i) => s.classList.toggle('active', i===index));
  dots.forEach((d,i) => d.classList.toggle('active', i===index));
}

function startGalleryAutoplay(){
  setInterval(() => {
    gallerySlideIndex = (gallerySlideIndex+1) % galleryTotal;
    showGallerySlide(gallerySlideIndex);
  }, 3800);
}

function addGallerySwipe(stage){
  let startX = 0;
  stage.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, {passive:true});
  stage.addEventListener('touchend', e => {
    const diff = e.changedTouches[0].clientX - startX;
    if(Math.abs(diff) > 40){
      gallerySlideIndex = diff < 0
        ? (gallerySlideIndex+1) % galleryTotal
        : (gallerySlideIndex-1+galleryTotal) % galleryTotal;
      showGallerySlide(gallerySlideIndex);
    }
  }, {passive:true});
}

function initGallery(){
  const stage = document.getElementById('photoStage');
  const dotsWrap = document.getElementById('photoDots');
  const fallback = document.getElementById('photoFallback');

  let checked = 0;
  const loaded = [];

  PHOTOS.forEach((src, idx) => {
    const test = new Image();
    test.onload = () => { loaded[idx] = src; checked++; if(checked === PHOTOS.length) finish(); };
    test.onerror = () => { checked++; if(checked === PHOTOS.length) finish(); };
    test.src = src;
  });

  function finish(){
    const valid = loaded.filter(Boolean);
    if(valid.length === 0){
      fallback.style.display = 'flex';
      return;
    }

    valid.forEach((src, i) => {
      const img = document.createElement('img');
      img.src = src;
      img.alt = 'Nosotros dos';
      img.className = 'photo-slide' + (i === 0 ? ' active' : '');
      stage.insertBefore(img, fallback);

      const dot = document.createElement('span');
      dot.className = 'photo-dot' + (i === 0 ? ' active' : '');
      dotsWrap.appendChild(dot);
    });

    galleryTotal = valid.length;

    if(galleryTotal > 1){
      dotsWrap.style.display = 'flex';
      startGalleryAutoplay();
      addGallerySwipe(stage);
    }
  }
}

initGallery();

/* ---------------------- peonía en SVG reutilizable ---------------------- */
function peonyMarkup(){
  const outer = [];
  for(let i=0;i<8;i++){
    const angle = i*45;
    outer.push(`<ellipse cx="50" cy="30" rx="19" ry="26" fill="#ffffff" transform="rotate(${angle} 50 50)"/>`);
  }
  const middle = [];
  for(let i=0;i<6;i++){
    const angle = 22 + i*60;
    middle.push(`<ellipse cx="50" cy="37" rx="15" ry="19" fill="#ffc2d6" transform="rotate(${angle} 50 50)"/>`);
  }
  const inner = [];
  for(let i=0;i<5;i++){
    const angle = i*72;
    inner.push(`<ellipse cx="50" cy="44" rx="9" ry="12" fill="#ff8fb3" transform="rotate(${angle} 50 50)"/>`);
  }
  return `<svg viewBox="0 0 100 132" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <line x1="50" y1="78" x2="50" y2="124" stroke="#4caf70" stroke-width="4" stroke-linecap="round"/>
      <path d="M50 100 Q65 96 66 110 Q54 112 50 100 Z" fill="#5cb85c"/>
      ${outer.join('')}
      ${middle.join('')}
      ${inner.join('')}
      <circle cx="50" cy="50" r="6" fill="#ff6b9d"/>
    </svg>`;
}

function makePeonyElement(sizePx){
  const wrap = document.createElement('span');
  wrap.style.display = 'inline-block';
  wrap.style.width = sizePx + 'px';
  wrap.style.height = (sizePx*1.32) + 'px';
  wrap.innerHTML = peonyMarkup();
  return wrap;
}

// sello del sobre
document.getElementById('envelopeSeal').appendChild(makePeonyElement(44));

/* ---------------------- lluvia de peonías y corazones ---------------------- */
const rainLayer = document.getElementById('rain-layer');

function spawnFloatingItem(){
  const isPeony = Math.random() < 0.45;
  const el = document.createElement('div');
  el.className = 'float-item' + (isPeony ? '' : ' heart');
  el.style.left = Math.random()*94 + '%';

  const duration = 5 + Math.random()*5; // entre 5 y 10 segundos
  el.style.animationDuration = duration + 's';

  if(isPeony){
    const size = 26 + Math.random()*26; // 26 a 52px
    el.style.width = size + 'px';
    el.style.height = (size*1.32) + 'px';
    el.innerHTML = peonyMarkup();
  }else{
    const size = 14 + Math.random()*20; // 14 a 34px
    el.style.fontSize = size + 'px';
    el.textContent = '🤍';
  }

  el.addEventListener('animationend', () => el.remove());
  rainLayer.appendChild(el);
}

let rainInterval = null;
function startRain(){
  for(let i=0;i<40;i++){
    setTimeout(spawnFloatingItem, Math.random()*1500);
  }
  rainInterval = setInterval(spawnFloatingItem, 700);
}

function burstExtraRain(amount){
  for(let i=0;i<amount;i++){
    setTimeout(spawnFloatingItem, i*90);
  }
}

/* ---------------------- abrir el sobre ---------------------- */
const envelopeWrap = document.getElementById('envelopeWrap');
const envelopeScreen = document.getElementById('envelope-screen');
const surpriseScreen = document.getElementById('surprise-screen');
const song = document.getElementById('song');

let opened = false;
envelopeWrap.addEventListener('click', () => {
  if(opened) return;
  opened = true;

  envelopeScreen.classList.add('opening');
  startRain();

  song.play().catch(() => {});

  setTimeout(() => {
    envelopeScreen.style.display = 'none';
    surpriseScreen.style.display = 'flex';
    setTimeout(startTypewriter, 1500);
  }, 700);
});

/* ---------------------- reproductor de música ---------------------- */
const playBtn = document.getElementById('playBtn');
const eqBox = document.getElementById('eqBox');
const progressTrack = document.getElementById('progressTrack');
const progressFill = document.getElementById('progressFill');
const timeCurrent = document.getElementById('timeCurrent');
const timeTotal = document.getElementById('timeTotal');

function formatTime(t){
  if(!isFinite(t)) return '0:00';
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function setPlayingUI(isPlaying){
  playBtn.textContent = isPlaying ? '❚❚' : '▶';
  eqBox.classList.toggle('paused', !isPlaying);
}

song.addEventListener('play', () => setPlayingUI(true));
song.addEventListener('pause', () => setPlayingUI(false));
song.addEventListener('ended', () => {
  setPlayingUI(false);
  song.currentTime = 0;
});

song.addEventListener('loadedmetadata', () => {
  timeTotal.textContent = formatTime(song.duration);
});

song.addEventListener('timeupdate', () => {
  timeCurrent.textContent = formatTime(song.currentTime);
  if(song.duration){
    progressFill.style.width = (song.currentTime/song.duration*100) + '%';
  }
});

playBtn.addEventListener('click', () => {
  if(song.paused){
    song.play().catch(() => {});
  }else{
    song.pause();
  }
});

progressTrack.addEventListener('click', (e) => {
  const rect = progressTrack.getBoundingClientRect();
  const ratio = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
  if(song.duration){
    song.currentTime = ratio * song.duration;
  }
});

/* ---------------------- carta con máquina de escribir ---------------------- */
const letterTextEl = document.getElementById('letterText');
const counterEl = document.getElementById('counter');
const signatureEl = document.getElementById('signature');

// Convierte "**texto**" en una lista de { ch, bold } sin los asteriscos,
// para poder escribir letra por letra respetando la negrita.
function parseBoldChars(raw){
  const chars = [];
  let bold = false;
  let i = 0;
  while(i < raw.length){
    if(raw[i] === '*' && raw[i+1] === '*'){
      bold = !bold;
      i += 2;
      continue;
    }
    chars.push({ ch: raw[i], bold });
    i++;
  }
  return chars;
}

function renderChars(chars){
  let html = '';
  let curBold = null;
  let buffer = '';

  function flush(){
    if(buffer === '') return;
    const escaped = escapeHTML(buffer).replace(/\n/g,'<br>');
    html += curBold ? `<strong>${escaped}</strong>` : escaped;
    buffer = '';
  }

  chars.forEach(c => {
    if(c.bold !== curBold){
      flush();
      curBold = c.bold;
    }
    buffer += c.ch;
  });
  flush();
  return html;
}

function startTypewriter(){
  const chars = parseBoldChars(LETTER_MESSAGE);
  let i = 0;
  letterTextEl.innerHTML = '<span class="cursor">|</span>';

  function typeNext(){
    if(i >= chars.length){
      letterTextEl.innerHTML = renderChars(chars);
      onTypingDone();
      return;
    }

    letterTextEl.innerHTML = renderChars(chars.slice(0, i+1)) + '<span class="cursor">|</span>';

    const char = chars[i].ch;
    let delay = 28;
    if(char === '.') delay = 200;
    if(char === '\n') delay = 300;

    i++;
    setTimeout(typeNext, delay);
  }

  typeNext();
}

function escapeHTML(str){
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function onTypingDone(){
  startCounter();
  counterEl.classList.add('show');
  signatureEl.classList.add('show');
  burstExtraRain(24);
}

/* ---------------------- contador en vivo ---------------------- */
function updateCounter(){
  const now = new Date();

  let months = (now.getFullYear() - START_DATE.getFullYear()) * 12 + (now.getMonth() - START_DATE.getMonth());
  let anchor = new Date(START_DATE);
  anchor.setMonth(anchor.getMonth() + months);
  if(anchor > now){
    months--;
    anchor = new Date(START_DATE);
    anchor.setMonth(anchor.getMonth() + months);
  }

  let diffMs = now - anchor;
  const days = Math.floor(diffMs / 86400000);
  diffMs -= days * 86400000;
  const hours = Math.floor(diffMs / 3600000);
  diffMs -= hours * 3600000;
  const minutes = Math.floor(diffMs / 60000);
  diffMs -= minutes * 60000;
  const seconds = Math.floor(diffMs / 1000);

  const parts = [`${months} meses`];
  if(days > 0) parts.push(`${days} días`);
  parts.push(`${hours}h ${minutes}m ${seconds}s`);

  counterEl.textContent = `Llevamos ${parts.join(', ')} juntos 🤍`;
}

let counterInterval = null;
function startCounter(){
  updateCounter();
  counterInterval = setInterval(updateCounter, 1000);
}
